version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    network_mode: host
    restart: always

  gofaxserver:
    image: gofaxserver:latest
    container_name: gofaxserver
    env_file:
      - .env
    volumes:
      - /etc/gofaxserver/config.json:/etc/gofaxserver/config.json
      # Shared fax temp dir (store-and-forward): FreeSWITCH — running on the
      # HOST in this setup — must see the same files at the same path. The
      # host dir must match faxing.temp_dir in config.json. New installs use
      # /var/lib/gofaxserver/tmp (the sample config value):
      - /var/lib/gofaxserver/tmp:/var/lib/gofaxserver/tmp
      # Legacy alternative: if your existing config.json uses temp_dir=/faxtmp,
      # keep that path working by mounting a host dir there instead:
      # - /faxtmp:/faxtmp
      # Optional: enables API-driven FS gateway provisioning (Admin → Gateways
      # in the portal). Must be the SAME path FreeSWITCH reads its gateway
      # XML from, and must match freeswitch.gateway_config_dir in config.json.
      # - /etc/freeswitch/gateways:/etc/freeswitch/gateways
    network_mode: host
    restart: always