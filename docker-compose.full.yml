# All-containerized deployment: PostgreSQL (gofaxserver) + FreeSWITCH +
# gofaxserver + PostgreSQL (portal, :5433) + portal + Caddy (reverse proxy;
# plain HTTP by default, TLS configured in the Caddyfile).
# FreeSWITCH runs in a container here; for FreeSWITCH as a Debian host
# service use docker-compose.yml instead. See docs/INSTALLATION.md.
#
# The portal stack (portal/docker-compose.yml: postgres-portal on :5433 +
# gofaxportal on :8081) is pulled in via `include` below, so `make up` starts
# everything with TWO separate databases: gofaxserver's on :5432 and the
# portal's on :5433, each with its own credentials. Portal env comes from
# portal/.env (seeded with generated secrets by `make setup`).
#
# Everything uses host networking on purpose:
#   - FreeSWITCH's ESL binds 127.0.0.1:8021 and the fax profile's dialplan
#     points at socket:127.0.0.1:8022 — with host networking gofaxserver and
#     FreeSWITCH reach each other on localhost with zero config changes.
#   - SIP (5060) and the RTP range (16384-32768/udp) bind directly on the
#     host, avoiding NAT/port-range pain for RTP.
#
# Before starting (or just: make setup):
#   1. cp sample.env .env  and fill it in (incl. SIGNALWIRE_TOKEN)
#   2. cp config.json.sample config.json  and edit it
#   3. cp -R examples/freeswitch volumes/freeswitch  (make fs-config)
#   4. edit volumes/freeswitch/vars.xml  -> sofia_ip = this host's LAN IP
#   5. mkdir -p volumes/gateways && chown 1000:1000 volumes/gateways
#      (gofaxserver's container user is uid 1000; FreeSWITCH runs as root
#      and reads the 0640 files it writes)

# Pull in the portal stack (its own postgres on :5433 + the portal on :8081)
# so `make up` starts the complete system. Portal variables interpolate from
# portal/.env (NOT the root .env); the portal compose file also still works
# standalone.
include:
  - path: portal/docker-compose.yml
    env_file:
      - portal/.env

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      # optional so `up -d caddy` works on host-service (Path B) installs
      # (note: parsing this file still requires portal/.env to exist —
      # `make portal-env` seeds it — because of the `include` above)
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    # Bind address: 127.0.0.1 (default) = localhost only. Set
    # POSTGRES_LISTEN_ADDRESSES=0.0.0.0 in .env temporarily for remote DB
    # access while debugging — firewall :5432 to trusted IPs when you do.
    command: postgres -c listen_addresses=${POSTGRES_LISTEN_ADDRESSES:-127.0.0.1}
    network_mode: host
    restart: always
    # gofaxserver depends on this being HEALTHY, not just started: on first
    # boot postgres takes a few seconds to init its data dir, and gofaxserver
    # does not retry a failed startup DB connect (it would run with a dead
    # handle until manually restarted).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fax}"]
      interval: 5s
      timeout: 5s
      retries: 12

  freeswitch:
    build:
      context: .
      dockerfile: examples/freeswitch/Dockerfile
      secrets:
        - signalwire_token
    image: gofaxserver-freeswitch:latest
    container_name: freeswitch
    volumes:
      # Config tree, seeded from examples/freeswitch by `make fs-config`
      # (edit volumes/freeswitch/vars.xml -> sofia_ip before first start).
      # The gateways subdirectory is overridden by the shared mount below.
      - ./volumes/freeswitch:/etc/freeswitch
      # Shared with gofaxserver: API-driven gateway provisioning writes
      # rendered XML here. SAME path in both containers is required.
      - ./volumes/gateways:/etc/freeswitch/gateways
      # Shared fax temp dir: for relayed (non-bridge) calls gofaxserver
      # store-and-forwards — FreeSWITCH reads/writes TIFFs here. SAME path
      # in both containers, must match faxing.temp_dir in config.json.
      - faxtmp:/var/lib/gofaxserver/tmp
      # mod_db (sofia registrations, softmodem-fallback flags) + logs.
      - fs_data:/var/lib/freeswitch
      - fs_logs:/var/log/freeswitch
    network_mode: host
    restart: always

  gofaxserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: gofaxserver:latest
    container_name: gofaxserver
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.json:/etc/gofaxserver/config.json:ro
      # Must be the SAME path FreeSWITCH reads gateway XML from, and must
      # match freeswitch.gateway_config_dir in config.json.
      - ./volumes/gateways:/etc/freeswitch/gateways
      # Shared fax temp dir — see the freeswitch service comment. Must
      # match faxing.temp_dir in config.json.
      - faxtmp:/var/lib/gofaxserver/tmp
    network_mode: host
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      freeswitch:
        condition: service_started

  # Reverse proxy fronting BOTH gofaxserver (:8080) and the fax portal
  # (:8081, from portal/docker-compose.yml). Plain HTTP on :80 by default;
  # TLS is configured entirely in the Caddyfile — set a DNS name there and
  # Caddy obtains/renews certificates automatically (see Caddyfile.sample).
  # Requires ./Caddyfile (seeded by `make setup` / `make caddy-setup`).
  caddy:
    image: caddy:2-alpine
    container_name: gofax-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host
    restart: always

secrets:
  signalwire_token:
    environment: SIGNALWIRE_TOKEN

volumes:
  fs_data:
  fs_logs:
  faxtmp:
  caddy_data:
  caddy_config:
